name: Release

# Publishes on version tags (v1.5.0 …):
#  - Docker images → GHCR (candidlens-api, candidlens-web; through 1.5.x
#    also under the old hirelens-api / hirelens-web names, so existing
#    pulls keep updating)
#  - CLI → npm as `candidlens` with provenance, plus the `hirelens`
#    forwarder once per forwarder version, through npm trusted publishing
#    (OIDC); the NPM_TOKEN secret is a fallback until it is removed
#  - GitHub Release with auto-generated notes
#
# Create a release:  git tag v1.5.0 && git push origin v1.5.0

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}

jobs:
  docker:
    name: Docker images → GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: candidlens-api
            legacy: hirelens-api
            dockerfile: apps/api/Dockerfile
          - name: candidlens-web
            legacy: hirelens-web
            dockerfile: apps/web/Dockerfile
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          # Owner + matrix name only: `github.repository` would double the
          # repo name (candidlens-candidlens-api). The legacy name gets the
          # same tags so `hirelens-*` pulls keep updating; drop it after 1.5.x.
          images: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.name }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.legacy }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  npm:
    name: CLI → npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Trusted publishing and provenance: npm trades this job's OIDC token
      # for a short-lived publish token and links each version to this run.
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.7.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or later; Node 22 ships npm 10.
      - name: Use npm 11
        run: npm install -g npm@11.21.2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build CLI bundle
        run: pnpm --filter candidlens... build

      # pnpm pack turns the forwarder's `workspace:^` dependency into a real
      # version range; npm publish would ship it unchanged.
      - name: Pack candidlens and the hirelens forwarder
        run: |
          mkdir -p "$RUNNER_TEMP/npm"
          pnpm --filter candidlens --filter hirelens pack --pack-destination "$RUNNER_TEMP/npm"

      # npm tries trusted publishing first and falls back to NODE_AUTH_TOKEN,
      # so the secret only matters until the packages disallow tokens.
      - name: Publish candidlens
        run: npm publish "$RUNNER_TEMP"/npm/candidlens-*.tgz --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # The forwarder's version changes rarely; publish it only when that
      # version isn't on npm yet, after candidlens so its dependency exists.
      - name: Publish the hirelens forwarder (new versions only)
        run: |
          version=$(node -p "require('./apps/cli-hirelens/package.json').version")
          if npm view "hirelens@$version" version >/dev/null 2>&1; then
            echo "hirelens@$version is already on npm; skipping."
          else
            npm publish "$RUNNER_TEMP"/npm/hirelens-*.tgz --provenance --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs: [docker, npm]
    if: ${{ always() }}
    steps:
      - uses: actions/checkout@v7

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          body: |
            CandidLens ${{ github.ref_name }}: see the [changelog](https://github.com/abhay-yemekar/candidlens/blob/main/CHANGELOG.md) and the [README](https://github.com/abhay-yemekar/candidlens#readme) for install instructions.

            **Try it:**
            ```bash
            npx candidlens --help
            ```
            or self-host:
            ```bash
            docker compose up --build -d
            ```
          fail_on_unmatched_files: false
